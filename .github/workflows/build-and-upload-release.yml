on:
  workflow_call:
    inputs:
      repo_tag:
        description: 'The tag of this repository to use'
        required: true
        type: string
      stas_server_endpoint_repo_tag:
        description: 'The tag of mddanish00/XUnity-AutoTranslator-StasServerEndpoint repo to use'
        required: true
        type: string
      localgateway_endpoint_repo_tag:
        description: 'The tag of mddanish00/XUnity-AutoTranslator-LocalGatewayEndpoint repo to use'
        required: true
        type: string
      tl_version:
        description: 'The version of PriconneReTL to use for building the release'
        required: true
        type: string

name: Build and Upload Release

jobs:
    download-PriconneReTL:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Fetch PriconneReTL if available
              id: cache-PriconneReTL
              uses: actions/cache@v6
              with:
                path: PriconneTL_${{ inputs.tl_version }}.zip
                key: tl-cache-${{ inputs.tl_version }}
                enableCrossOsArchive: true
            
            - name: Download PriconneReTL if not cached
              id: download-PriconneReTL
              if: steps.cache-PriconneReTL.outputs.cache-hit != true
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                gh release download ${{ inputs.tl_version }} \
                  --repo ImaterialC/PriconneRe-TL \
                  --pattern "PriconneTL_${{ inputs.tl_version }}.zip" \
                  --skip-existing
    
    build-StasServerEndpoint-and-Exit:
      needs: download-PriconneReTL
      uses: ./.github/workflows/build-endpoint-exit.yml
      with:
        repo_tag: ${{ inputs.repo_tag }}                                
        endpoint_repo: mddanish00/XUnity-AutoTranslator-StasServerEndpoint
        endpoint_repo_tag: ${{ inputs.stas_server_endpoint_repo_tag }}
        endpoint_binary_name: StasServer
        endpoint_project_name: StasServerEndpoint
        exit_binary_name: PriconneTLStasServerExit
        exit_project_name: StasServerExit
        tl_version: ${{ inputs.tl_version }}
    
    build-LocalGatewayEndpoint-and-Exit:
      needs: download-PriconneReTL
      uses: ./.github/workflows/build-endpoint-exit.yml
      with:
        repo_tag: ${{ inputs.repo_tag }}                                
        endpoint_repo: mddanish00/XUnity-AutoTranslator-LocalGatewayEndpoint
        endpoint_repo_tag: ${{ inputs.localgateway_endpoint_repo_tag }}
        endpoint_binary_name: LocalGateway
        endpoint_project_name: LocalGatewayEndpoint
        exit_binary_name: PriconneTLLocalGatewayExit
        exit_project_name: LocalGatewayExit
        tl_version: ${{ inputs.tl_version }}

    upload-release:
        runs-on: ubuntu-latest
        needs: [build-StasServerEndpoint-and-Exit, build-LocalGatewayEndpoint-and-Exit]
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                ref: ${{ inputs.repo_tag }}
                path: repo
            
            - name: Checkout XUnity-AutoTranslator-StasServerEndpoint repository
              uses: actions/checkout@v7
              with:
                ref: ${{ inputs.repo_tag }}
                path: stas-server-endpoint-repo
            
            - name: Checkout XUnity-AutoTranslator-LocalGatewayEndpoint repository
              uses: actions/checkout@v7
              with:
                ref: ${{ inputs.repo_tag }}
                path: localgateway-endpoint-repo
            
            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                path: .
                merge-multiple: true

            - name: Prepare licenses and repo readme
              run: |
                cp repo/LICENSE .
                cp repo/README.md .
                cp stas-server-endpoint-repo/LICENSE LICENSE-XUnity-AutoTranslator-StasServerEndpoint.txt
                cp localgateway-endpoint-repo/LICENSE LICENSE-XUnity-AutoTranslator-LocalGatewayEndpoint.txt

            - name: Zip release
              run: |
                zip PriconneTLStasServerExit-${{ inputs.repo_tag }}.zip PriconneTLStasServerExit.dll StasServer.dll LICENSE LICENSE-XUnity-AutoTranslator-StasServerEndpoint.txt README.md
                zip PriconneTLLocalGatewayExit-${{ inputs.repo_tag }}.zip PriconneTLLocalGatewayExit.dll LocalGateway.dll LICENSE LICENSE-XUnity-AutoTranslator-LocalGatewayEndpoint.txt README.md
            
            - name: Update release body
              uses: actions/github-script@v9
              with:
                script: |
                    const tag = '${{ inputs.repo_tag }}';
                    const owner = context.repo.owner;
                    const repo = context.repo.repo;

                    const release = await github.rest.repos.getReleaseByTag({
                        owner,
                        repo,
                        tag,
                    });

                    const current_body = release.data.body || '';
                    const new_line = `Build with PriconneReTL version: [${{ inputs.tl_version }}](https://github.com/ImaterialC/PriconneRe-TL/releases/tag/${{ inputs.tl_version }})\nBuild with StasServerEndpoint version: [${{ inputs.stas_server_endpoint_repo_tag }}](https://github.com/mddanish00/XUnity-AutoTranslator-StasServerEndpoint/tree/${{ inputs.stas_server_endpoint_repo_tag }})\nBuild with LocalGatewayEndpoint version: [${{ inputs.localgateway_endpoint_repo_tag }}](https://github.com/mddanish00/XUnity-AutoTranslator-LocalGatewayEndpoint/tree/${{ inputs.localgateway_endpoint_repo_tag }})`;
                    let new_body;

                    console.log("Current body: " + current_body);
                    if (current_body.includes("Build with PriconneReTL version:")) {
                        const regex = new RegExp(/Build with PriconneReTL version: .*[\r\n]+Build with StasServerEndpoint version: .*[\r\n]+Build with LocalGatewayEndpoint version: .*/);
                        new_body = current_body.replace(regex, new_line);
                    } else {
                        new_body = `${current_body}\n\n${new_line}`;
                    }
                    console.log("New body: " + new_body);

                    await github.rest.repos.updateRelease({
                        owner,
                        repo,
                        release_id: release.data.id,
                        body: new_body,
                    });
            
            - name: Upload release asset
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                gh release upload ${{ inputs.repo_tag }} PriconneTLStasServerExit-${{ inputs.repo_tag }}.zip PriconneTLLocalGatewayExit-${{ inputs.repo_tag }}.zip --clobber --repo mddanish00/PriconneTLExit